[agent]
name = "you-agent"
version = "0.1.0"
description = "Agent for converting YouTube coding tutorials into interactive courses with duration check and categorization."

[options.MODEL_API_KEY]
type = "string"
description = "API key for the model provider"

[options.YOUTUBE_API_KEY]
type = "string"
description = "API key for YouTube Data API v3"

[options.MODEL_NAME]
type = "string"
description = "What model to use (e.g., 'gpt-4.1')"
default = "gpt-4.1"

[options.MODEL_PROVIDER]
type = "string"
description = "What model provider to use (e.g., 'openai')"
default = "openai"

[options.MODEL_MAX_TOKENS]
type = "string"
description = "Max tokens to use"
default = "8000"

[options.MODEL_TEMPERATURE]
type = "string"
description = "What model temperature to use"
default = "0.3"

[options.TIMEOUT_MS]
type = "string"
description = "Connection/tool timeouts in ms"
default = "300"

[runtimes.executable]
command = ["bash", "-c", "./run_agent.sh main.py"]